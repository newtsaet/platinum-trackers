<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Silent Hill: Townfall — Trophy Roadmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style id="css">
:root{
  --fog:#E4E5E0; --paper:#F0F0EC; --ink:#1E2627; --mute:#5D6966; --line:#C3C7C0;
  --rust:#8E3A2A; --rust-soft:#E9D6CF; --sea:#476663; --sea-soft:#D3DEDB;
  --bronze:#9A6638; --silver:#7E8789; --gold:#A8831F; --plat:#5C7A93;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --fog:#171C1D; --paper:#1F2627; --ink:#E2E4DF; --mute:#9AA5A1; --line:#36403F;
    --rust:#D1735E; --rust-soft:#3A2420; --sea:#86AAA5; --sea-soft:#22302F;
    --bronze:#C48A58; --silver:#A9B1B3; --gold:#D3AE45; --plat:#8DAAC2;
  }
}
:root[data-theme="dark"]{
  --fog:#171C1D; --paper:#1F2627; --ink:#E2E4DF; --mute:#9AA5A1; --line:#36403F;
  --rust:#D1735E; --rust-soft:#3A2420; --sea:#86AAA5; --sea-soft:#22302F;
  --bronze:#C48A58; --silver:#A9B1B3; --gold:#D3AE45; --plat:#8DAAC2;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--fog);color:var(--ink);font:400 16px/1.55 "Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:40px 20px 80px}
h1,h2,h3{font-family:"Spectral",Georgia,"Times New Roman",serif;font-weight:600;line-height:1.2;margin:0}
h1{font-size:clamp(30px,6vw,44px);letter-spacing:-.01em}
.sub{color:var(--mute);margin:8px 0 22px;max-width:60ch}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--fog);display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 -20px 22px;padding:8px 20px 0}
.tabs button{font:500 15px/1 "Public Sans",system-ui,sans-serif;color:var(--mute);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px 12px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--rust)}
.tabs button:focus-visible{outline:2px solid var(--sea);outline-offset:-2px}
.tabs .count{color:var(--mute);font-weight:400;margin-left:4px}
.guide-link{margin-left:auto;align-self:center;margin-bottom:6px;font:500 14px/1 "Public Sans",system-ui,sans-serif;color:var(--rust);text-decoration:none;border:1px solid var(--rust);border-radius:4px;padding:7px 10px;white-space:nowrap}
.tabs .guide-link{background:none;cursor:pointer;padding:7px 10px;border:1px solid var(--rust);color:var(--rust)}
.tabs .guide-link+.guide-link{margin-left:6px}
@media (max-width:480px){.wide{display:none}}
.guide-link:hover{background:var(--rust);color:var(--paper)}
.guide-link:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
@media (max-width:420px){.tabs button{padding:10px 8px 12px}.guide-link{padding:6px 8px;font-size:13px}}

.dial{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:18px 16px 14px}
.ticks{display:flex;gap:3px;align-items:flex-end;height:44px}
.tick{flex:1;background:var(--line);border-radius:1px;height:40%;transition:height .25s,background .25s}
.tick.on{background:var(--rust);height:100%}
.readout{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;gap:12px;flex-wrap:wrap}
.freq{font-family:"Spectral",Georgia,serif;font-size:26px}
.freq small{font-size:15px;color:var(--mute);font-family:"Public Sans",system-ui,sans-serif}
.grades{display:flex;gap:14px;color:var(--mute);font-size:14px;flex-wrap:wrap}
.grades span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--c)}

.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meter{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.meter .lbl{font-size:13px;color:var(--mute)}
.meter .num{font-family:"Spectral",Georgia,serif;font-size:22px}
.meter .num small{font-size:14px;color:var(--mute);font-family:"Public Sans",system-ui,sans-serif}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--rust);transition:width .25s}
.meter.full .bar i{background:var(--sea)}

.controls{display:flex;justify-content:space-between;align-items:center;margin:18px 0 0;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--mute)}
.controls label{display:flex;gap:8px;align-items:center;cursor:pointer;color:var(--ink)}
.status{font-size:13px}
.hub-link{display:inline-block;margin-bottom:14px;font-size:14px;font-weight:500;color:var(--sea);text-decoration:none}
.hub-link:hover{text-decoration:underline}
.ctl-right{display:flex;align-items:center;gap:12px}
.linkbtn{font:500 14px/1 "Public Sans",system-ui,sans-serif;color:var(--sea);background:none;border:0;padding:4px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.linkbtn:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.syncp{margin-top:12px;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:16px}
.syncp h2{font-size:18px}
.syncp p{margin:6px 0 10px;font-size:14px;color:var(--mute);max-width:62ch}
.syncp .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.syncp input[type=password]{flex:1 1 220px;min-width:0;font:14px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:9px 10px;border:1px solid var(--line);border-radius:4px;background:var(--fog);color:var(--ink)}
.btn{font:500 14px/1 "Public Sans",system-ui,sans-serif;color:var(--ink);background:var(--fog);border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer}
.btn.primary{background:var(--rust);border-color:var(--rust);color:var(--paper)}
.btn:disabled{opacity:.6;cursor:default}
.btn:focus-visible,.syncp input:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.smsg{font-size:14px;margin-top:10px}
.smsg:empty{display:none}
.smsg.err{color:var(--rust)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chips button{font:500 13px/1 "Public Sans",system-ui,sans-serif;padding:7px 11px;border-radius:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chips button:focus-visible{outline:2px solid var(--sea);outline-offset:2px}

.stage{margin-top:52px}
.stage-head{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:baseline}
.stage-num{font-family:"Spectral",Georgia,serif;font-size:44px;line-height:1;color:var(--rust);grid-row:span 2}
.stage-head h2{font-size:24px}
.stage-meta{color:var(--mute);font-size:14px}
.stage-intro{margin:14px 0 0;max-width:62ch}
details.how{margin-top:10px;font-size:15px}
details.how summary{cursor:pointer;color:var(--sea);font-weight:500}
details.how ol{margin:8px 0 0;padding-left:20px}
details.how li{margin:4px 0}

.part{margin-top:28px;border-left:2px solid var(--line);padding-left:18px}
.part h3{font-size:18px;font-style:italic;font-weight:400}
.part .who{color:var(--mute);font-size:13px;margin-top:2px}

details.cpart{margin-top:30px}
details.cpart>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:12px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
details.cpart>summary::-webkit-details-marker{display:none}
details.cpart>summary h2{font-size:22px;flex:1}
details.cpart>summary .pnum{font-family:"Spectral",Georgia,serif;color:var(--rust);font-size:22px;min-width:1.2em}
details.cpart>summary .pc{font-size:14px;color:var(--mute)}
details.cpart>summary::after{content:"";width:8px;height:8px;border:solid var(--mute);border-width:0 2px 2px 0;transform:rotate(45deg);margin-left:4px;align-self:center;transition:transform .2s}
details.cpart:not([open])>summary::after{transform:rotate(-45deg)}
.pnote{font-size:14px;color:var(--mute);margin:10px 0 0}

ul.list{list-style:none;margin:10px 0 0;padding:0}
.tr{display:grid;grid-template-columns:28px 1fr;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.tr:last-child{border-bottom:0}
.tr input{appearance:none;width:22px;height:22px;margin:2px 0 0;border:2px solid var(--mute);border-radius:4px;background:var(--paper);cursor:pointer;display:grid;place-content:center}
.tr input::after{content:"";width:11px;height:6px;border:solid var(--paper);border-width:0 0 2.5px 2.5px;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.tr input:checked{background:var(--rust);border-color:var(--rust)}
.tr input:checked::after{opacity:1}
.tr input:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.tr .name{font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap;cursor:pointer}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.dot[data-g=Bronze]{--c:var(--bronze)} .dot[data-g=Silver]{--c:var(--silver)} .dot[data-g=Gold]{--c:var(--gold)} .dot[data-g=Platinum]{--c:var(--plat)}
.tag{font-size:12px;font-weight:500;padding:1px 7px;border-radius:10px;background:var(--sea-soft);color:var(--sea)}
.tag.miss{background:var(--rust-soft);color:var(--rust)}
.tag.story{background:none;box-shadow:inset 0 0 0 1px var(--line);color:var(--mute)}
.kind{font-size:12px;font-weight:500;padding:1px 7px;border-radius:3px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.kind.k-doc,.kind.k-phone,.kind.k-signal,.kind.k-postcard,.kind.k-lockbox,.kind.k-container{border-color:transparent;background:var(--rust-soft);color:var(--rust)}
.kind.k-dog,.kind.k-scifi{border-color:transparent;background:var(--sea-soft);color:var(--sea)}
.desc{grid-column:2;color:var(--mute);font-size:15px}
.tip{grid-column:2;font-size:15px;margin-top:2px}
.cl .desc{color:var(--ink);opacity:.85}
.tr.done .name span.t{text-decoration:line-through;text-decoration-color:var(--rust);text-decoration-thickness:2px}
.tr.done .desc,.tr.done .tip{opacity:.5}
body.hide-done .tr.done{display:none}
.tr.filtered{display:none}
.empty{color:var(--mute);font-size:14px;padding:10px 0;display:none}
.part.alldone .empty,.cpart.alldone .empty{display:block}
body:not(.hide-done) .part .empty{display:none}

[hidden]{display:none!important}
footer{margin-top:60px;color:var(--mute);font-size:13px;border-top:1px solid var(--line);padding-top:16px}
footer button{font:inherit;color:var(--rust);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
@media (prefers-reduced-motion: reduce){.tick,.bar i,details.cpart>summary::after{transition:none}}
@media (max-width:520px){main{padding:28px 16px 64px}.tabs{margin:0 -16px 20px;padding:8px 16px 0}.stage-num{font-size:36px}}
</style>
</head>

ext to the vehicle on the right. Proceed through the alleyway, past both wooden doors and enter the wooden shed at the end of the garden. The coin is on a metal storage shelf inside.",0],["ng","scifi","Strange Book [2]","Head to the store southwest of Atlas Square. Take a left as you enter and find the book on a bookshelf next to the window.",0],["ng","dog","Blind Bank [2]","After receiving the boltcutters, head to the laundromat where you obtained the lockbox key from your previous playthrough. Place the silver coin into the bank just beyond the clerk desk.",0],["ng","dog","Gold Coin","When you are back in the Control Room for Puzzle #23 from your first playthrough, be sure to unlock doors 793 and 621. Head to the floor below to find the coin on the metal console in the room just north of the generator.",0],["ng","scifi","Strange Book [3]","Now that you've unlocked the door for 621 above, go there to find the book sitting next to a resource container.",0],["ng","dog","Blind Bank [3]","Continue the chapter as normal, turning the red handsheel and proceeding down the ladder. When you reach the four-way intersection in the red corridor, go straight to find the final blind bank. This will trigger the \"Dog\" ending when you complete the game, unlocking Let's Talk This Out.",0],["ng","scifi","Final Requirement","Returning from the blind bank, take the left at the four-way intersection to proceed towards the end of the game. Instead of passing through the door at the end, interact with the access panel on the left and use the Strange Access Card. This will immediately trigger the \"Sci-fi\" ending, overwriting your \"Dog\" ending and unlocking Sci-fi-lent Hill.",0],["ng","key","Pistol-3000 (Richard, backup)","If you've previously completed the \"Sci-fi\" ending for Sci-fi-lent Hill, you will gain access to an infinite ammunition pistol for your next playthrough. While this item can be obtained with Simon (in the storage locations where you originally found his axe), the const PARTS = {1:"Arrival",2:"Zoe",3:"The Patient",4:"Clara Woods",5:"Richard",6:"Simon",ng:"New Game+ only"};
const PNOTES = {1:"Simon. Shorefront and Town Square.",2:"Zoe's rounds, then Simon back in Shorefront.",3:"Zoe in the Medical Centre, then Simon in its altered version.",4:"Simon. Clara Woods, Atlas Square, the Brae houses and the lockers.",5:"Richard inside CEG HQ.",6:"Simon. CEG HQ – Different and SWDP – Different.",ng:"Pick these up during your New Game+ run (Stage 2), in this order. Simon's Pistol-3000 only appears after you've earned the Sci-fi ending."};
const KIND = {doc:"Document / clue",phone:"Phone number",signal:"CRTV signal",postcard:"Postcard",lockbox:"Lockbox key",container:"Resource container",key:"Key item",puzzle:"Puzzle",dog:"Dog ending",scifi:"Sci-fi ending"};
const METERS = [["doc","Documents & clues",85],["phone","Phone numbers",13],["signal","CRTV signals",19],["postcard","Strange postcards",15],["lockbox","Lockbox keys",7],["container","Resource containers",7]];
const FILTERS = [["all","Everything"],["doc","Documents & clues"],["phone","Phone numbers"],["signal","Signals"],["postcard","Postcards"],["res","Lockboxes & containers"],["key","Key items"],["puzzle","Puzzles"],["ending","NG+ ending items"]];
let filter = "all";

const ALL = []; STAGES.forEach(s=>s.parts.forEach(p=>p.items.forEach(i=>ALL.push(i))));
COLL.forEach((c,i)=>c.push("c"+i));   // [part,kind,title,desc,count,id]

let state; try{ state = JSON.parse(document.getElementById("state").textContent) }catch(e){ state = {} }
function norm(s){ s=s||{}; s.done=s.done||{}; s.items=s.items||{}; s.tab=s.tab==="items"?"items":"trophies"; s.ts=s.ts||0; return s; }
state = norm(state);
let mode = "local", artifactNs = null;
try{
  const ls = JSON.parse(localStorage.getItem("townfall-roadmap")||"null");
  if(ls && (ls.ts||0) > state.ts) state = norm(ls);
}catch(e){}

const root = document.getElementById("root");
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function trophiesHTML(){
  const counts = {Bronze:0,Silver:0,Gold:0,Platinum:0};
  ALL.forEach(i=>counts[G[i[2]]]++);
  let html = `<div class="dial" aria-label="Trophy progress">
    <div class="ticks">${ALL.map(i=>`<span class="tick" title="${esc(i[1])}"></span>`).join("")}</div>
    <div class="readout"><div class="freq" id="freq"></div>
      <div class="grades">${["Bronze","Silver","Gold","Platinum"].map(g=>`<span style="--c:var(--${g==="Platinum"?"plat":g.toLowerCase()})">${counts[g]} ${g.toLowerCase()}</span>`).join("")}</div></div>
  </div>`;
  STAGES.forEach(s=>{
    html += `<section class="stage"><div class="stage-head"><div class="stage-num">${s.n}</div><h2>${esc(s.title)}</h2><div class="stage-meta">${esc(s.meta)}</div></div>
    <p class="stage-intro">${esc(s.intro)}</p>
    <details class="how"><summary>How to run this stage</summary><ol>${s.how.map(h=>`<li>${esc(h)}</li>`).join("")}</ol></details>`;
    s.parts.forEach(p=>{
      html += `<div class="part" data-part><h3>${esc(p.t)}</h3>${p.who?`<div class="who">${esc(p.who)}</div>`:""}<ul class="list">`;
      p.items.forEach(([id,name,g,desc,tip,tags])=>{
        const done = !!state.done[id];
        html += `<li class="tr${done?" done":""}" data-id="${id}" data-set="done">
          <input type="checkbox" id="t-${id}" ${done?"checked":""} aria-label="${esc(name)}">
          <label class="name" for="t-${id}"><span class="dot" data-g="${G[g]}" title="${G[g]}"></span><span class="t">${esc(name)}</span>${tags.map(t=>`<span class="tag${t==="Missable"?" miss":t==="Story"?" story":""}">${t}</span>`).join("")}</label>
          <div class="desc">${esc(desc)}</div>${tip?`<div class="tip">${esc(tip)}</div>`:""}</li>`;
      });
      html += `</ul><div class="empty">All earned here.</div></div>`;
    });
    html += `</section>`;
  });
  return html;
}

function itemsHTML(){
  let html = `<div class="meters">${METERS.map(([k,l,t])=>`<div class="meter" data-meter="${k}"><div class="lbl">${l}</div><div class="num"><span>0</span> <small>/ ${t}</small></div><div class="bar"><i style="width:0"></i></div></div>`).join("")}</div>
  <div class="chips" role="group" aria-label="Show">${FILTERS.map(([k,l])=>`<button type="button" data-filter="${k}" aria-pressed="${k===filter}">${l}</button>`).join("")}</div>`;
  [1,2,3,4,5,6,"ng"].forEach(p=>{
    const rows = COLL.filter(c=>c[0]===p);
    html += `<details class="cpart" open data-cpart="${p}"><summary><span class="pnum">${p==="ng"?"+":p}</span><h2>${PARTS[p]}</h2><span class="pc"></span></summary>
      <p class="pnote">${esc(PNOTES[p])}</p><ul class="list">`;
    rows.forEach(([_,k,title,desc,n,id])=>{
      const done = !!state.items[id];
      html += `<li class="tr cl${done?" done":""}" data-id="${id}" data-set="items" data-kind="${k}">
        <input type="checkbox" id="i-${id}" ${done?"checked":""} aria-label="${esc(title)}">
        <label class="name" for="i-${id}"><span class="t">${esc(title)}</span><span class="kind k-${k}">${KIND[k]}</span></label>
        <div class="desc">${esc(desc)}</div></li>`;
    });
    html += `</ul><div class="empty">Nothing left to show in this part.</div></details>`;
  });
  return html;
}

function render(){
  const tN = ALL.filter(i=>state.done[i[0]]).length, iN = COLL.filter(c=>state.items[c[5]]).length;
  root.innerHTML = `${/\.github\.io$/.test(location.hostname)?`<a class="hub-link" href="../">← All trackers</a>`:""}<h1>Silent Hill: Townfall<br>trophy roadmap</h1>
  <p class="sub">All ${ALL.length} trophies in the order you'll earn them, plus every collectible, key item and puzzle in the order you'll find them. Based on the PSNProfiles trophy and collectible guides by angelbless45 and Flynnerigan.</p>
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-trophies" aria-selected="${state.tab==="trophies"}" aria-controls="p-trophies" data-tab="trophies">Trophies<span class="count" id="tc">${tN}/${ALL.length}</span></button>
    <button role="tab" id="tab-items" aria-selected="${state.tab==="items"}" aria-controls="p-items" data-tab="items">Collectibles<span class="count" id="ic">${iN}/${COLL.length}</span></button>
    <button type="button" class="guide-link" id="dlPage" title="Download this tracker with your progress as an .html file">Save<span class="wide"> as</span> .html ↓</button>
    <a class="guide-link" href="https://psnprofiles.com/guide/26096-silent-hill-townfall-trophy-guide" target="_blank" rel="noopener noreferrer"><span class="wide">Original </span>guide ↗</a>
  </div>
  <div class="controls"><label><input type="checkbox" id="hide" ${state.hideDone?"checked":""}> Hide checked</label><span class="ctl-right"><span class="status" id="status"></span><button type="button" class="linkbtn" id="syncToggle" aria-expanded="${syncOpen}" aria-controls="syncPanel">Sync</button></span></div>
  ${syncPanelHTML()}
  <div id="p-trophies" role="tabpanel" aria-labelledby="tab-trophies" ${state.tab!=="trophies"?"hidden":""}>${trophiesHTML()}</div>
  <div id="p-items" role="tabpanel" aria-labelledby="tab-items" ${state.tab!=="items"?"hidden":""}>${itemsHTML()}</div>
  <footer>Checks save automatically. Collectibles only count once the game saves (manual or autosave), so save often. Ending-score details come from community testing and may change. <button id="reset">Clear all checks</button></footer>`;
  document.body.classList.toggle("hide-done", !!state.hideDone);
  applyFilter(); refresh(); setStatus();
}

function applyFilter(){
  root.querySelectorAll("#p-items .tr").forEach(li=>{
    const k=li.dataset.kind;
    const show = filter==="all" || k===filter || (filter==="res"&&(k==="lockbox"||k==="container")) || (filter==="ending"&&(k==="dog"||k==="scifi"));
    li.classList.toggle("filtered", !show);
  });
  root.querySelectorAll("[data-filter]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.filter===filter));
  refreshEmpty();
}

function refreshEmpty(){
  root.querySelectorAll("[data-part],[data-cpart]").forEach(p=>{
    const rows=[...p.querySelectorAll(".tr")];
    const visible = rows.some(r=>!r.classList.contains("filtered") && !(state.hideDone && r.classList.contains("done")));
    p.classList.toggle("alldone", !visible);
  });
}

function refresh(){
  const tN = ALL.filter(i=>state.done[i[0]]).length;
  document.getElementById("freq").innerHTML = `${tN} <small>of ${ALL.length} earned</small>`;
  const ticks = root.querySelectorAll(".tick");
  ALL.forEach((i,k)=>ticks[k].classList.toggle("on", !!state.done[i[0]]));
  document.getElementById("tc").textContent = `${tN}/${ALL.length}`;
  document.getElementById("ic").textContent = `${COLL.filter(c=>state.items[c[5]]).length}/${COLL.length}`;
  METERS.forEach(([k,l,t])=>{
    const got = COLL.filter(c=>c[1]===k && state.items[c[5]]).reduce((a,c)=>a+c[4],0);
    const m = root.querySelector(`[data-meter="${k}"]`);
    m.querySelector(".num span").textContent = got;
    m.querySelector(".bar i").style.width = Math.min(100,got/t*100)+"%";
    m.classList.toggle("full", got>=t);
  });
  root.querySelectorAll("[data-cpart]").forEach(d=>{
    const rows = COLL.filter(c=>String(c[0])===d.dataset.cpart);
    d.querySelector(".pc").textContent = `${rows.filter(c=>state.items[c[5]]).length} / ${rows.length}`;
  });
  refreshEmpty();
}

let statusText = "";
function setStatus(t){ if(t!==undefined) statusText=t; const el=document.getElementById("status"); if(el) el.textContent = statusText || (mode==="artifact"?"Progress saves to this page":syncOn()?"Sync on":"Saved on this device"); }

function buildDoc(){
  const css = document.getElementById("css").textContent;
  const app = document.getElementById("app").textContent;
  const json = JSON.stringify(state).replace(/</g,"\\u003c");
  return '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<title>Silent Hill: Townfall — Trophy Roadmap</title>\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">\n<style id="css">'+css+'<\/style>\n</head>\n<body>\n<main id="root"></main>\n<script id="state" type="application/json">'+json+'<\/script>\n<script id="app">'+app+'<\/script>\n</body>\n</html>\n';
}

async function downloadPage(){
  const d=new Date(), filename="townfall-trophy-roadmap-"+d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+".html";
  const text = buildDoc();
  let dl = null;
  try{ if(window.claude && typeof window.claude.use==="function") dl = await window.claude.use("downloads"); }catch(e){}
  if(dl){
    try{ await dl.save({filename, data:text}); setStatus("Saved "+filename); }
    catch(e){ const c=e&&e.code; setStatus(c==="declined"?"Download cancelled":c==="rate_limited"?"A download prompt is already open":"Downloads aren't available here"); }
    return;
  }
  try{
    const url = URL.createObjectURL(new Blob([text],{type:"text/html"}));
    const a = document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    setStatus("Downloaded "+filename);
  }catch(e){ setStatus("Downloads aren't available here"); }
}

/* ---------- GitHub Gist sync ---------- */
const SYNC_KEY = "townfall-sync", GIST_FILE = "townfall-progress.json";
let sync = null; try{ sync = JSON.parse(localStorage.getItem(SYNC_KEY)||"null"); }catch(e){}
let syncOpen = false, syncReady = false, syncBusy = false, pushTimer = null, syncMsg = "", syncErr = false, lastSync = null;
function syncOn(){ return !!(sync && sync.token && sync.gistId); }
function syncPanelHTML(){
  const body = syncOn()
    ? `<p>Your checks sync to a secret GitHub gist${lastSync?`, last synced at ${lastSync}`:""}. Open this page on another device and connect it with a token to share the same progress.</p>
       <div class="row"><button type="button" class="btn primary" id="syncNow">Sync now</button><button type="button" class="btn" id="syncOff">Disconnect this device</button></div>`
    : `<p>Paste a GitHub personal access token with the <strong>gist</strong> scope. The token stays in this browser only. The first device creates a secret gist named ${GIST_FILE}; other devices find it automatically.</p>
       <div class="row"><input type="password" id="tokenIn" placeholder="ghp_…" autocomplete="off" spellcheck="false" aria-label="GitHub token"><button type="button" class="btn primary" id="syncConnect">Connect</button></div>`;
  return `<section class="syncp" id="syncPanel" ${syncOpen?"":"hidden"} aria-labelledby="sync-h"><h2 id="sync-h">Sync between devices</h2>${body}<div class="smsg${syncErr?" err":""}" id="smsg" role="status">${esc(syncMsg)}</div></section>`;
}
function sMsg(t, err){ syncMsg=t||""; syncErr=!!err; const el=document.getElementById("smsg"); if(el){ el.textContent=syncMsg; el.classList.toggle("err",syncErr); } }
function sStatus(t){ statusText = t; setStatus(); }
async function gh(path, opts){
  opts = opts||{};
  const r = await fetch("https://api.github.com"+path, {method:opts.method||"GET", cache:"no-store",
    headers:Object.assign({"Authorization":"Bearer "+(opts.token||sync.token),"Accept":"application/vnd.github+json"}, opts.body?{"Content-Type":"application/json"}:{}),
    body: opts.body?JSON.stringify(opts.body):undefined});
  if(!r.ok){ const e=new Error("GitHub "+r.status); e.status=r.status; throw e; }
  return r.json();
}
function payload(){ return JSON.stringify({app:"townfall-roadmap",done:state.done,items:state.items,hideDone:!!state.hideDone,ts:state.ts},null,1); }
function errText(e){
  if(e && (e.status===401||e.status===403)) return "GitHub rejected the token. Check that it has the gist scope and hasn't expired.";
  if(e && e.status===404) return "The sync gist wasn't found. Disconnect and connect again to recreate it.";
  return "Couldn't reach GitHub. Your checks are kept on this device and will sync when you're back online.";
}
function stampNow(){ return new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}); }
async function connect(token){
  token = (token||"").trim();
  if(!token){ sMsg("Paste your token first.", true); return; }
  sMsg("Connecting…");
  try{
    let id = null;
    for(let page=1; page<=5 && !id; page++){
      const list = await gh("/gists?per_page=100&page="+page, {token});
      const hit = list.find(g=>g.files && g.files[GIST_FILE]); if(hit) id = hit.id;
      if(list.length<100) break;
    }
    if(!id){
      state.ts = state.ts || Date.now();
      const g = await gh("/gists", {token, method:"POST", body:{description:"Silent Hill: Townfall trophy tracker progress", public:false, files:{[GIST_FILE]:{content:payload()}}}});
      id = g.id;
    }
    sync = {token, gistId:id};
    try{ localStorage.setItem(SYNC_KEY, JSON.stringify(sync)); }catch(e){}
    syncReady = false;
    await pull();
    render(); sMsg("Connected. Progress now syncs automatically.");
  }catch(e){ sync=null; sMsg(errText(e), true); }
}
async function pull(){
  if(!syncOn() || syncBusy) return;
  syncBusy = true; sStatus("Syncing…");
  try{
    const g = await gh("/gists/"+sync.gistId);
    const f = g.files && g.files[GIST_FILE];
    let remote = null;
    if(f){ let txt = f.content; if(f.truncated){ txt = await (await fetch(f.raw_url,{cache:"no-store"})).text(); } remote = JSON.parse(txt||"{}"); }
    syncReady = true;
    if(remote && (remote.ts||0) > (state.ts||0)){
      state.done = remote.done||{}; state.items = remote.items||{}; state.hideDone = !!remote.hideDone; state.ts = remote.ts;
      try{ localStorage.setItem("townfall-roadmap", JSON.stringify(state)) }catch(e){}
      const y = window.scrollY; render(); window.scrollTo(0,y);
    } else if(!remote || (state.ts||0) > (remote.ts||0)){
      syncBusy = false; await push(); return;
    }
    lastSync = stampNow(); sStatus("Synced "+lastSync); sMsg("");
  }catch(e){ sStatus("Not synced"); sMsg(errText(e), true); }
  finally{ syncBusy = false; }
}
async function push(){
  if(!syncOn()) return;
  if(!syncReady){ return pull(); }
  syncBusy = true; sStatus("Syncing…");
  try{
    await gh("/gists/"+sync.gistId, {method:"PATCH", body:{files:{[GIST_FILE]:{content:payload()}}}});
    lastSync = stampNow(); sStatus("Synced "+lastSync); sMsg("");
  }catch(e){ sStatus("Not synced"); sMsg(errText(e), true); }
  finally{ syncBusy = false; }
}
function schedulePush(){ if(!syncOn()) return; sStatus("Syncing…"); clearTimeout(pushTimer); pushTimer = setTimeout(()=>{ pushTimer=null; syncBusy ? schedulePush() : push(); }, 1500); }
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && !pushTimer) pull(); });
window.addEventListener("online", ()=>{ if(syncOn()) push(); });

let timer = null;
function save(publish){
  state.ts = Date.now();
  try{ localStorage.setItem("townfall-roadmap", JSON.stringify(state)) }catch(e){}
  if(publish!==false) schedulePush();
  if(mode!=="artifact" || publish===false) return;
  setStatus("Saving…");
  clearTimeout(timer);
  timer = setTimeout(async ()=>{
    try{ sessionStorage.setItem("townfall-scroll", String(window.scrollY)) }catch(e){}
    try{ await artifactNs.publish(buildDoc()); setStatus("Saved"); }
    catch(e){
      const code = e && e.code;
      if(code==="not_granted"||code==="not_writer"){ mode="local"; setStatus("Saved on this device only"); }
      else if(code==="conflict"){ setStatus(""); }
      else setStatus("Couldn't save to the page; kept on this device");
    }
  }, 2000);
}

root.addEventListener("change", e=>{
  const t = e.target;
  if(t.id==="hide"){ state.hideDone = t.checked; document.body.classList.toggle("hide-done", t.checked); refreshEmpty(); save(); return; }
  const li = t.closest(".tr"); if(!li) return;
  const bag = state[li.dataset.set], id = li.dataset.id;
  if(t.checked) bag[id]=true; else delete bag[id];
  li.classList.toggle("done", t.checked);
  refresh(); save();
});
root.addEventListener("click", e=>{
  const tab = e.target.closest("[data-tab]");
  if(tab){ state.tab = tab.dataset.tab;
    root.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-selected", b===tab));
    document.getElementById("p-trophies").hidden = state.tab!=="trophies";
    document.getElementById("p-items").hidden = state.tab!=="items";
    save(false); return; }
  const f = e.target.closest("[data-filter]");
  if(f){ filter = f.dataset.filter; applyFilter(); return; }
  if(e.target.closest("#dlPage")){ downloadPage(); return; }
  if(e.target.id==="syncToggle"){ syncOpen=!syncOpen; e.target.setAttribute("aria-expanded",syncOpen); document.getElementById("syncPanel").hidden=!syncOpen; if(syncOpen&&!syncOn()) document.getElementById("tokenIn").focus(); return; }
  if(e.target.id==="syncConnect"){ const b=e.target; b.disabled=true; connect(document.getElementById("tokenIn").value).finally(()=>{ const nb=document.getElementById("syncConnect"); if(nb) nb.disabled=false; }); return; }
  if(e.target.id==="syncNow"){ pull(); return; }
  if(e.target.id==="syncOff"){ sync=null; syncReady=false; try{ localStorage.removeItem(SYNC_KEY) }catch(err){} statusText=""; render(); sMsg("This device is disconnected. Your gist and its progress are untouched."); return; }
  if(e.target.id==="reset" && confirm("Clear every trophy and collectible check?")){ state.done={}; state.items={}; render(); save(); }
});
root.addEventListener("keydown", e=>{
  if(e.target.id==="tokenIn" && e.key==="Enter"){ document.getElementById("syncConnect").click(); return; }
  if(!e.target.matches("[data-tab]") || !["ArrowLeft","ArrowRight"].includes(e.key)) return;
  const other = root.querySelector(`[data-tab="${e.target.dataset.tab==="trophies"?"items":"trophies"}"]`);
  other.focus(); other.click();
});

render();
if(syncOn()) pull();
try{ const y = +sessionStorage.getItem("townfall-scroll"); if(y){ sessionStorage.removeItem("townfall-scroll"); requestAnimationFrame(()=>window.scrollTo(0,y)); } }catch(e){}
(async ()=>{
  try{
    if(window.claude && typeof window.claude.use==="function"){
      artifactNs = await window.claude.use("artifact");
      if(artifactNs){ mode="artifact"; setStatus(); }
    }
  }catch(e){}
})();
})();
</script>
</body>
</html>
