<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crimson Desert — Trophy Roadmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Grenze+Gotisch:wght@500;700&display=swap" rel="stylesheet">
<style id="css">
:root{
  /* Color settings: light mode. Dark mode is set further down. */
  --background:#E1E3E4;     /* page background */
  --surface:#F1F2F2;        /* panels, menu, empty checkboxes, search box */
  --text:#1A1D21;           /* main text and headings */
  --text-soft:#59606A;      /* descriptions, counts, status, checkbox borders */
  --border:#C3C8CD;         /* borders, dividers, unearned pennants and diamonds */
  --accent:#9E1A2C;         /* title, ticked trophies and challenges, stage numbers, buttons, Missable text */
  --accent-soft:#F0D8DB;    /* background of Missable tags and met requirements */
  --accent-2:#1F7178;       /* artifacts: ticked boxes, diamonds, artifact buttons, focus outlines, Sync */
  --accent-2-soft:#D3E7E8;  /* artifact highlight and button backgrounds */
  --bronze:#9A6638; --silver:#7E8789; --gold:#A8831F; --platinum:#5C7A93;  /* trophy grade colors */
  --glow:none; --shadow:0 12px 32px rgba(20,24,30,.16);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
/* Dark mode colors (used when the device is in dark mode). Keep these two dark lists identical. */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --background:#111317; --surface:#1A1D22; --text:#E6E4DF; --text-soft:#9AA1A9; --border:#30353C;
    --accent:#E25A6C; --accent-soft:#3A1C22; --accent-2:#5CC6CB; --accent-2-soft:#15302F;
    --bronze:#C48A58; --silver:#A9B1B3; --gold:#D3AE45; --platinum:#8DAAC2;
    --glow:0 0 7px rgba(92,198,203,.6); --shadow:0 12px 32px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --background:#111317; --surface:#1A1D22; --text:#E6E4DF; --text-soft:#9AA1A9; --border:#30353C;
  --accent:#E25A6C; --accent-soft:#3A1C22; --accent-2:#5CC6CB; --accent-2-soft:#15302F;
  --bronze:#C48A58; --silver:#A9B1B3; --gold:#D3AE45; --platinum:#8DAAC2;
  --glow:0 0 7px rgba(92,198,203,.6); --shadow:0 12px 32px rgba(0,0,0,.5);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--background);color:var(--text);font:400 17px/1.5 "Alegreya Sans","Segoe UI",system-ui,-apple-system,sans-serif;font-variant-numeric:lining-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;background:var(--background)}
main{max-width:780px;margin:0 auto;padding:44px 20px 80px}
a{color:inherit}
button{font:inherit;color:inherit}
[hidden]{display:none!important}

.gothic,h1,.stage-num,.stage-head h2,.part h3,details.grp>summary h2,.big{font-family:"Grenze Gotisch","UnifrakturMaguntia",Georgia,"Times New Roman",serif}
h1,h2,h3{margin:0;line-height:1.1}
h1{font-size:clamp(48px,11vw,80px);font-weight:700;color:var(--accent);line-height:.92;letter-spacing:.005em}
h1 .h1-sub{display:block;font-size:.4em;font-weight:500;color:var(--text);margin-top:10px;letter-spacing:.01em}
.sub{color:var(--text-soft);margin:14px 0 26px;max-width:62ch}

/* sticky bar: tabs + guides menu */
#tabsTop{height:0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--background);display:flex;align-items:flex-end;gap:10px;border-bottom:1px solid var(--border);margin:0 -20px 16px;padding:6px 20px 0}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tabs button{font-weight:500;font-size:16px;line-height:1;color:var(--text-soft);background:none;border:0;border-bottom:3px solid transparent;padding:11px 12px 12px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent-2);outline-offset:-2px}
.tabs .count{color:var(--text-soft);font-weight:400;margin-left:5px;font-variant-numeric:tabular-nums}
.menu{position:relative;flex:none;align-self:center;margin-bottom:5px}
#menuBtn{font-weight:500;font-size:15px;line-height:1;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:8px 11px 8px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
#menuBtn:hover,#menuBtn[aria-expanded="true"]{border-color:var(--text)}
#menuBtn:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.chev{width:7px;height:7px;border:solid currentColor;border-width:0 1.6px 1.6px 0;transform:translateY(-2px) rotate(45deg);transition:transform .15s}
#menuBtn[aria-expanded="true"] .chev{transform:translateY(1px) rotate(-135deg)}
.mpanel{position:absolute;right:0;top:calc(100% + 8px);width:min(320px,calc(100vw - 32px));max-height:min(70vh,520px);overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:6px;z-index:20}
.mhead{font-size:13.5px;color:var(--text-soft);padding:8px 10px 3px}
.mpanel a,.mpanel .save{display:block;width:100%;text-align:left;padding:7px 10px 8px;border-radius:5px;text-decoration:none;background:none;border:0;cursor:pointer}
.mpanel a:hover,.mpanel a:focus-visible,.mpanel .save:hover,.mpanel .save:focus-visible{background:var(--background);outline:none}
.mpanel .ml{display:block;font-weight:500}
.mpanel .ms{display:block;font-size:14px;color:var(--text-soft);line-height:1.3}
.mpanel hr{border:0;border-top:1px solid var(--border);margin:6px 4px}
@media (max-width:480px){.wide{display:none}}

.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:15px;color:var(--text-soft);margin:0 0 20px}
.controls label{display:flex;gap:8px;align-items:center;cursor:pointer;color:var(--text)}
.status{font-size:14px}

/* checkboxes */
.ck{appearance:none;-webkit-appearance:none;width:22px;height:22px;margin:3px 0 0;border:2px solid var(--text-soft);border-radius:4px;background:var(--surface);cursor:pointer;display:grid;place-content:center;flex:none}
.ck::after{content:"";width:11px;height:6px;border:solid var(--surface);border-width:0 0 2.5px 2.5px;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.ck:checked{background:var(--accent);border-color:var(--accent)}
.ck:checked::after{opacity:1}
.ck:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.controls .ck,.sr .ck{width:18px;height:18px;margin:0}
.sr .ck{margin-top:3px}
.controls .ck::after,.sr .ck::after{width:9px;height:5px;border-width:0 0 2px 2px}
.ar .ck:checked{background:var(--accent-2);border-color:var(--accent-2)}

/* progress boxes */
.tally,.vault{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:18px 16px 14px}
.pennants{display:flex;gap:3px;height:34px}
.pn{flex:1;background:var(--border);clip-path:polygon(0 0,100% 0,100% 100%,50% 74%,0 100%);transition:background .25s}
.pn.on{background:var(--c)}
[data-g=Bronze]{--c:var(--bronze)} [data-g=Silver]{--c:var(--silver)} [data-g=Gold]{--c:var(--gold)} [data-g=Platinum]{--c:var(--platinum)}
.readout{display:flex;justify-content:space-between;align-items:baseline;gap:6px 14px;flex-wrap:wrap;margin-top:12px}
.big{font-size:36px;font-weight:700;line-height:1}
.big small{font:400 16px/1 "Alegreya Sans","Segoe UI",system-ui,sans-serif;color:var(--text-soft);margin-left:2px}
.grades{display:flex;gap:14px;color:var(--text-soft);font-size:15px;flex-wrap:wrap}
.grades span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--c)}
.subline{font-size:15px;color:var(--text-soft);margin-top:4px}
.gems{display:flex;flex-wrap:wrap;gap:12px 16px;padding:3px 2px 0}
.gg{display:flex;flex-wrap:wrap;gap:6px}
.gm{width:10px;height:10px;transform:rotate(45deg);border:1.5px solid var(--border);transition:background .25s,border-color .25s}
.gm.on{background:var(--accent-2);border-color:var(--accent-2);box-shadow:var(--glow)}

/* stages */
.stage{margin-top:56px}
.stage-head{display:grid;grid-template-columns:auto 1fr;gap:2px 16px;align-items:baseline}
.stage-num{font-size:58px;font-weight:700;line-height:.85;color:var(--accent);grid-row:span 2}
.stage-head h2{font-size:31px;font-weight:700}
.stage-meta{color:var(--text-soft);font-size:15px}
.stage-intro{margin:14px 0 0;max-width:64ch}
details.how{margin-top:10px;font-size:16px}
details.how summary{cursor:pointer;color:var(--accent);font-weight:500;width:max-content;max-width:100%}
details.how ol,details.how ul{margin:8px 0 0;padding-left:22px;max-width:64ch}
details.how li{margin:5px 0}
details.how .inl{margin-left:6px;font-size:14.5px}
.part{margin-top:32px;border-left:2px solid var(--border);padding-left:18px}
.part h3{font-size:24px;font-weight:700}
.part .who{color:var(--text-soft);font-size:15px;margin-top:3px}

ul.list,ul.slist{list-style:none;margin:8px 0 0;padding:0}
.tr{display:grid;grid-template-columns:28px minmax(0,1fr);gap:3px 12px;padding:15px 0;border-bottom:1px solid var(--border)}
.tr:last-child,.ar:last-child{border-bottom:0}
.name{font-weight:700;display:flex;align-items:center;gap:5px 8px;flex-wrap:wrap;cursor:pointer;min-width:0}
.name .t{overflow-wrap:anywhere}
.rar{font-weight:400;font-size:14px;color:var(--text-soft);margin-left:auto;font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.tag{font-size:13px;font-weight:500;line-height:1.35;padding:0 8px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--border);color:var(--text-soft)}
.tag.miss{box-shadow:none;background:var(--accent-soft);color:var(--accent)}
.desc{grid-column:2;color:var(--text-soft);font-size:16px}
.tip{grid-column:2;font-size:16px;margin-top:2px;max-width:66ch}
ul.tips{grid-column:2;margin:4px 0 0;padding-left:20px;font-size:16px;max-width:64ch}
ul.tips li{margin:3px 0}
.extras{grid-column:2;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;margin-top:7px}
.lk{font-size:14.5px;color:var(--text-soft);text-decoration:underline;text-decoration-color:var(--border);text-underline-offset:3px}
.lk:hover{color:var(--text);text-decoration-color:currentColor}
.lk:focus-visible,.tlink:focus-visible,.find:focus-visible,.artchip:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;border-radius:3px}
.artchip{font-size:14.5px;display:inline-flex;align-items:center;gap:8px;padding:3px 11px 3px 9px;border-radius:999px;border:1px solid var(--accent-2);color:var(--accent-2);background:none;cursor:pointer}
.artchip .gem{width:8px;height:8px;transform:rotate(45deg);border:1.5px solid currentColor}
.artchip.full .gem{background:currentColor}
.artchip b{font-weight:700}
.needs{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 0;padding:0;list-style:none}
.needs li{font-size:14px;line-height:1.4;padding:1px 9px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--border);color:var(--text-soft)}
.needs li.met{box-shadow:none;background:var(--accent-soft);color:var(--accent)}
.needs li.met::before{content:"\2713\00a0"}
.platline{grid-column:2;font-size:16px;margin-top:4px}

details.subs{grid-column:2;margin-top:10px}
details.subs>summary,details.how>summary{list-style:none;display:inline-flex;align-items:center;gap:8px}
details.subs>summary{cursor:pointer;color:var(--accent);font-weight:500;font-size:16px}
details.subs>summary::-webkit-details-marker,details.how>summary::-webkit-details-marker,details.grp>summary::-webkit-details-marker{display:none}
details.subs>summary::before,details.how>summary::before{content:"";width:7px;height:7px;border:solid currentColor;border-width:0 1.6px 1.6px 0;transform:rotate(-45deg);transition:transform .15s;margin-right:2px}
details.subs[open]>summary::before,details.how[open]>summary::before{transform:rotate(45deg) translate(-2px,-1px)}
details.subs>summary .sc{color:var(--text-soft);font-weight:400;font-variant-numeric:tabular-nums}
details.subs>summary:focus-visible,details.how>summary:focus-visible,details.grp>summary:focus-visible{outline:2px solid var(--accent-2);outline-offset:3px;border-radius:3px}
.sr{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--border)}
.sr>.desc,.sr>.tip,.sr>.extras,.sr>.owner{grid-column:2 / -1}
.sr .name{font-weight:500}
.sr .desc{color:var(--text);font-size:16px}
.sr .tip{color:var(--text-soft);font-size:15px}
.sr.solo{grid-template-columns:28px minmax(0,1fr) auto;gap:3px 12px;padding:14px 0;border-top:0;border-bottom:1px solid var(--border)}
.sr.solo:last-child{border-bottom:0}
.sr.solo .ck{width:22px;height:22px}
.sr.solo .ck::after{width:11px;height:6px;border-width:0 0 2.5px 2.5px}
.sr.solo .name{font-weight:700}
.owner{grid-column:2;font-size:14.5px;color:var(--text-soft)}
.find{grid-column:3;grid-row:1;align-self:start;justify-self:end;font-size:14.5px;line-height:1.3;display:inline-flex;align-items:center;gap:7px;color:var(--accent-2);background:none;border:0;border-radius:4px;padding:2px 2px 2px 6px;margin-top:1px;cursor:pointer;white-space:nowrap}
.find::before{content:"";width:7px;height:7px;transform:rotate(45deg);border:1.5px solid currentColor;flex:none}
.find:hover{text-decoration:underline;text-underline-offset:3px}
@media (max-width:520px){.find .fw{display:none}}

.tr.done>.name .t,.sr.done>.name .t,.ar.done>.name .t{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--accent)}
.ar.done>.name .t{text-decoration-color:var(--accent-2)}
.tr.done>.desc,.tr.done>.tip,.tr.done>ul.tips,.sr.done>.desc,.sr.done>.tip,.ar.done>.loc{opacity:.55}
body.hide-done .tr.done,body.hide-done .sr.done,body.hide-done .ar.done{display:none}
.ar.filtered{display:none}
.empty{display:none;color:var(--text-soft);font-size:15px;padding:12px 0}
.alldone>.empty{display:block}

/* artifacts */
.search{display:flex;align-items:center;gap:8px 14px;margin:20px 0 0;flex-wrap:wrap}
.search input{flex:1;min-width:200px;font:inherit;font-size:16px;padding:9px 12px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text)}
.search input::placeholder{color:var(--text-soft)}
.search input:focus{outline:2px solid var(--accent-2);outline-offset:1px;border-color:transparent}
.qn{font-size:15px;color:var(--text-soft)}
.noresults{color:var(--text-soft);margin:18px 0 0}
details.grp{margin-top:32px}
details.grp>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:12px;padding-bottom:8px;border-bottom:2px solid var(--text)}
details.grp>summary h2{font-size:26px;font-weight:700;flex:1;min-width:0}
details.grp>summary .pc{font-size:15px;color:var(--text-soft);white-space:nowrap;font-variant-numeric:tabular-nums}
details.grp>summary::after{content:"";width:8px;height:8px;border:solid var(--text-soft);border-width:0 2px 2px 0;transform:rotate(45deg);margin-left:2px;align-self:center;transition:transform .2s}
details.grp:not([open])>summary::after{transform:rotate(-45deg)}
.gnote{font-size:15px;color:var(--text-soft);margin:9px 0 0}
.tlink{font-size:inherit;color:var(--text);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-decoration-color:var(--border);text-underline-offset:3px}
.tlink:hover{text-decoration-color:currentColor}
.ar{display:grid;grid-template-columns:28px minmax(0,1fr);gap:3px 12px;padding:14px 0;border-bottom:1px solid var(--border);border-radius:4px}
.ar .loc{grid-column:2;font-size:16px;max-width:66ch}
.ar .lks{grid-column:2;display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:3px}
.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%,35%{background:var(--accent-2-soft);box-shadow:-10px 0 0 var(--accent-2-soft),10px 0 0 var(--accent-2-soft)}100%{background:transparent;box-shadow:none}}

footer{margin-top:64px;color:var(--text-soft);font-size:14.5px;border-top:1px solid var(--border);padding-top:16px}
footer button{color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
@media (prefers-reduced-motion: reduce){.pn,.gm,.chev,details.grp>summary::after,details.subs>summary::before,details.how>summary::before{transition:none}.flash{animation:none;outline:2px solid var(--accent-2)}}
@media (max-width:520px){
  main{padding:30px 16px 64px}
  .bar{margin:0 -16px 14px;padding:6px 16px 0}
  .tabs button{padding:11px 9px 12px}
  .stage-num{font-size:46px}
  .stage-head h2{font-size:27px}
  .part{padding-left:14px}
  .gems{gap:10px 12px}
  .gg{gap:5px}
  .gm{width:9px;height:9px}
}

/* sync and hub link */
.hub-link{display:inline-block;margin-bottom:14px;font-size:15px;font-weight:500;color:var(--accent-2);text-decoration:none}
.hub-link:hover{text-decoration:underline;text-underline-offset:3px}
.ctl-right{display:flex;align-items:center;gap:14px}
.linkbtn{font-weight:500;font-size:15px;line-height:1;color:var(--accent-2);background:none;border:0;padding:4px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.linkbtn:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.syncp{margin:-6px 0 22px;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:16px}
.syncp h2{font-size:19px;font-weight:700}
.syncp p{margin:6px 0 12px;font-size:15.5px;color:var(--text-soft);max-width:62ch}
.syncp .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.syncp .row+.row{margin-top:10px}
.syncp input[type=password]{flex:1 1 220px;min-width:0;font:15px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:9px 10px;border:1px solid var(--border);border-radius:4px;background:var(--background);color:var(--text)}
.btn{font-weight:500;font-size:15px;line-height:1;color:var(--text);background:var(--background);border:1px solid var(--border);border-radius:4px;padding:9px 13px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn:disabled{opacity:.6;cursor:default}
.btn:focus-visible,.syncp input:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.smsg{font-size:15px;margin-top:10px}
.smsg:empty{display:none}
.smsg.err{color:var(--accent)}
</style>
</head>
<body>
<main id="root"></main>
<script id="state" type="application/json">{}</script>
<script id="app">
(function(){
"use strict";

 {n:1, title:"Explore and settle in", meta:"Bells, fast travel and every Sealed Abyss Artifact",
  intro:"Uncover the map, open up fast travel and pick up Sealed Abyss Artifacts whenever you pass one. Each artifact unlocks a challenge, and nearly every trophy is a set of challenges. Upgrade your gear and grow your inventory along the way.",
  how:[
   ["Ring the Bells in towns to reveal the map. Fast travel points show as a white area with a “?”: from high ground, hold L1 + R1 to flash your sword, or raise your lantern (it works mid-glide), and they light up."],
   ["Secret Places double as fast travel points and give an Abyss Artifact for skills. They count toward Pilgrim of Wonders."],
   ["Tick off the 141 Sealed Abyss Artifacts in the Artifacts tab as you go. The game doesn’t track them for you."],
   ["Grab the free gold bar in Hernand (500 silver at the bank) and the Hwando nearby, a sword that can carry you through most of the game.",[["Gold bar video","https://www.youtube.com/watch?v=M6Zi_lwG6pU"],["Hwando video","https://www.youtube.com/watch?v=aBXD1vmNTAg"]]],
   ["Buy the small bag every shop owner sells, and take the bag side quests from merchants with a white circle on the minimap. Inventory tops out at 240 slots."],
   ["On armor, favor defense: attack stats on gloves and boots only boost punches and kicks."],
   ["Don’t sell or use any unique-looking weapon, or anything with durability, until its challenge is done."]
  ],
  parts:[
   {t:"Early story", who:"Chapters 1 to 3", items:[
    T("novice","Novice Adventurer","B","84.85","Countless adventures await beyond the horizon.","Chapter 1. Pops during “Woman in White” as you return to Hernand, after “Abyss without Balance”.",{tags:["Story"]}),
    T("camper","Master Camper","B","63.48","A safe haven now stands ready for you and your comrades.","Start of Chapter 3. Finish “Familiar Curses” (after “Return of the Comrade”) and talk with Yann at Howling Hill.",{tags:["Story"]})
   ]}
  ]},
 {n:2, title:"Story and missables", meta:"Twelve chapters, plus a prologue and an epilogue",
  intro:"A few challenges lock or get much harder as the story moves on. Handle these, then play the story at your own pace, picking off easy challenges as you go.",
  how:[
   ["Make a manual save before Chapter 8’s “Rebel Suppression” for Into the Barrage."],
   ["Leave at least 3 bounties unclaimed until you pick up the Back Alley Cleanup artifact."],
   ["Don’t use special weapons until you’re ready for their challenge: most of them can break."],
   ["Moving camp to Pailune can wait. It unlocks after Chapter 7 and stays available."]
  ],
  parts:[
   {t:"Before they lock", who:"Each also sits under its trophy in stage 3. Ticking either one ticks both.", refs:["disruption","into-the-barrage","back-alley-cleanup","marni-laser-helm","vessel-of-dark-pursuit"]},
   {t:"Story", who:"Chapters 7 to 12", items:[
    T("pailune","Protector of Pailune","S","33.19","Freedom returned to Pailune after defeating the Black Bears and the Jackals.","End of Chapter 7, during “Time to Face Justice” (after “Ludvig’s Whereabouts”), once Myurdin falls and the Jackals are driven out. Do Disruption before this.",{tags:["Story"]}),
    T("returnee","Proud Returnee","S","10.77","Trials overcome have paved the way back home.","Rebuild Pailune with the comrades you’ve found (“Reconstruction of Pailune”). After Chapter 7, follow the quest to move your camp there.",{tags:["Side quest"]}),
    T("story","Expert Storyteller","G","17.32","Every thread of Pywel’s narrative now forms a complete story.","Finish Chapter 12. Play the Epilogue afterwards too: Conqueror of the Abysses needs it.",{tags:["Story"]})
   ]}
  ]},
 {n:3, title:"Checklist: the game", meta:"Every challenge set, in any order",
  intro:"Once the story is done, this is where most of the 200 hours go. Work through the sets in any order; the Journal’s Challenges tab shows what’s left. Enemy camps give reliable respawns for the combat sets.",
  how:[
   ["A challenge stays locked until you pick up its Sealed Abyss Artifact. While a challenge’s artifact isn’t ticked, “Find its artifact” takes you to its location."],
   ["Once a challenge is complete, use its artifact from your inventory to claim the reward."],
   ["Hold light or heavy attack instead of mashing: the attack keeps repeating on its own."],
   ["Expert Explorer and Unvanquished Strategist pop on their own once the trophies they need are in."],
   ["Pearl Abyss patches often, and some challenges have become easier since the guide was written."]
  ],
  parts:[
   {t:"Exploration", who:"Counts toward Expert Explorer", items:[
    T("maze","Maze Pathfinder","B","10.38","Even the most tangled paths fail to lead you astray.","Four Mazes, each marked by a “?” in a white circle when you’re close. Each gives an Abyss Artifact and a fast travel point.",{links:[["Video guide","https://www.youtube.com/watch?v=Nwm1lf9Fadg"],["MapGenie","https://mapgenie.io/crimson-desert/maps/pywel"]],subs:[
     S("maze-burham","Maze of Burham","Clear out the enemies before starting. Good stamina helps with the tower climbs."),
     S("maze-desert-mouth","Smoking Lands Desert Mouth Maze","The fiddliest one. Read the floor map in the center, then find every moon or sun door and flip it with Force Palm until the map lights up at each door."),
     S("maze-ancient-rift","Ancient Rift Maze","No enemies and little climbing. Use Focus Light on each set of pillars."),
     S("maze-dawnreach","Maze of Dawnreach","Clear the enemies first. Force Palm at level 3 is essential to knock the towers into place quickly enough.")]}),
    T("spires","Conqueror of Spires","B","13.59","Climbing ever higher has opened the way toward the skies above.","Eight Spires, marked with a tower icon, lead up to the Abyss. Only reaching them counts here, but you’ll need every Abyss run for Conqueror of the Abysses, so do them as you go.",{links:[["Video guide","https://www.youtube.com/watch?v=W6ERrfnYyOY"]],subs:[
     S("spire-stars","Spire of the Stars","Story: Chapter 4, “Spire of Stars”."),
     S("spire-soaring","Spire of Soaring","Story: Chapter 5, “Toward the Nest”."),
     S("spire-sun","Spire of the Sun","Story: Chapter 9, “Unwavering Steps”."),
     S("spire-jijeong","Jijeong Temple Pagoda","Story: Chapter 9, “Face the Inner Self”."),
     S("spire-insight","Spire of Insight","Northwest of the Steel Mountains, southern Hernand.","",{links:[["Video","https://youtu.be/qTNnF8zimCw"]]}),
     S("spire-ringing-truth","Spire of Ringing Truth","Western Pailune.","",{links:[["Video","https://youtu.be/UQKaAEQjzb0"]]}),

    T("stars","Navigator of the Stars","B","9.20","The constellations that illuminate Pywel have revealed their secrets.","13 constellation challenges. They need the Constellation Helmet from the “What the Stars Left Behind” quest chain at Scholastone Institute in Hernand, which shows up after some Troll Alliance or Scholastone quests.",{tags:["Collectible"],links:[["Video guide","https://www.youtube.com/watch?v=-dsPTbztClc"]]}),
    T("pilgrim","Pilgrim of Wonders","S","8.81","The hidden beauty of Pywel has been revealed.","All 60 Secret Places. Each is also a fast travel point and gives an Abyss Artifact, so they’re worth grabbing early.",{tags:["Collectible"],links:[["PowerPyx list","https://www.powerpyx.com/crimson-desert-all-secret-places-locations/"],["Video guide","https://www.youtube.com/watch?v=Nvb-uDNVF40"]]}),
    T("puzzle","Puzzle Solver","S","8.75","Sharp insight now guides you through any riddle.","All 37 Ancient Ruins. Some need late skills, so leave them for late or post-game and follow a guide step by step.",{tags:["Collectible"],links:[["PowerPyx solutions","https://www.powerpyx.com/crimson-desert-all-ancient-ruins-locations-solutions/"],["Video guide","https://www.youtube.com/watch?v=eGIMm9wkg6s"]]}),
    T("light","Lightbringer","S","16.08","Shadow guided into light has restored the forgotten sanctums.","All 16 Sanctums. You’ll want a Kuku Pot and Force Current. The Witches give the Sanctum quests: the first in Chapter 5, the other four out in the world. The Sanctum of Mortification can’t be done before Chapter 9.",{links:[["Witch locations","https://www.powerpyx.com/crimson-desert-all-witch-locations/"],["Video (Joe Hammer)","https://www.youtube.com/watch?v=xotwUx1lp98"],["Video (Gamerpillar)","https://www.youtube.com/watch?v=qB7LFy_akDE"]]}),
    T("beast","Beast Slayer","B","11.67","You’ve defeated the beasts, bringing peace to Pywel.","Seven New Power boss challenges. They only appear in Chapter 12 but count bosses you’ve already beaten. Bring plenty of food and upgraded weapons.",{links:[["PowerPyx boss locations","https://www.powerpyx.com/crimson-desert-all-new-power-boss-locations/"],["Video guide","https://www.youtube.com/watch?v=qj1OpEVRP80"]]}),
    T("abyss","Conqueror of the Abysses","G","9.91","Exploration of every abyss extends far into the depths of the world.","40 Abyss challenges, 39 of them from the Spire runs. After the story and the Epilogue, return to where you fought the first final boss. From the end of each Spire run, follow its line to the central island and hit the button there with Force Palm. Once every button is on, the central building opens and the trophy pops.",{tags:["Grind","Post-game"],links:[["PowerPyx Abyss puzzles","https://www.powerpyx.com/crimson-desert-all-abyss-restoration-puzzle-locations-solutions/"]]}),
    T("explorer","Expert Explorer","G","7.45","Revelation of every corner of Pywel brings the entire land into clear view.","Every Exploration challenge: the trophies below, plus the Legendary Animals.",{tags:["Collectible","Grind"],needs:["abyss","pilgrim","puzzle","maze","light","spires","stars","beast"],subs:[
     S("legendary-animals","All 22 Legendary Animals","Only the original 22 count, even though more have been added. Horses must be tamed; every other legendary animal must be killed.","Legendary fish can be grabbed by swimming up to them, and they max out a cat’s trust, handy for Natural Collector’s 30 pets.",{links:[["PowerPyx locations","https://www.powerpyx.com/crimson-desert-all-legendary-animals-locations/"],["Video","https://www.youtube.com/watch?v=yg3MU080_94"]]})]})
   ]},

    T("swords","Master of Swords","B","13.71","Through discipline and mastery, you’ve earned the right to be called a true master of the blade.","One-handed sword, easiest with a shield in the other hand.",{art:"sword",subs:SERIES("sword-of-trials","Sword of Trials",[

function norm(s){
  s = (s && typeof s==="object") ? s : {};
  s.done=s.done||{}; s.subs=s.subs||{}; s.lists=s.lists||{}; s.dx=s.dx||{};
  TABS.forEach(t=>{ if(t.id!=="trophies") s.lists[t.id]=s.lists[t.id]||{}; });
  if(!TABS.some(t=>t.id===s.tab)) s.tab="trophies";
  s.hideDone=!!s.hideDone; s.ts=s.ts||0;
  s.mt=s.mt||{};   /* when each tick last changed, so devices can merge tick by tick */
  const stamp=(set,bag)=>Object.keys(bag||{}).forEach(id=>{ const k=set+"|"+id; if(!s.mt[k]) s.mt[k]=1; });
  stamp("done",s.done); stamp("subs",s.subs); Object.keys(s.lists).forEach(l=>stamp(l,s.lists[l]));
  if(s.hideDone && !s.mt["pref|hideDone"]) s.mt["pref|hideDone"]=1;
  return s;
}
state = norm(state);

function tipHTML(t){
  if(!t) return "";
  if(Array.isArray(t)) return `<div class="tip">${esc(t[0])}</div><ul class="tips">${t.slice(1).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
  return `<div class="tip">${esc(t)}</div>`;
}

function trophiesHTML(){

  STAGES.forEach(s=>{
    h += `<section class="stage"><div class="stage-head"><div class="stage-num">${s.n}</div><h2>${esc(s.title)}</h2><div class="stage-meta">${esc(s.meta)}</div></div>
      <p class="stage-intro">${esc(s.intro)}</p>${howHTML("how-"+s.n, s.how)}`;
    s.parts.forEach(p=>{
      h += `<div class="part" data-part><h3>${esc(p.t)}</h3>${p.who?`<div class="who">${esc(p.who)}</div>`:""}<ul class="list">`;
      if(p.refs) p.refs.forEach(id=>h += subRow(SUBS[id],"m",true));
      else p.items.forEach(t=>h += trophyRow(t));
      h += `</ul><div class="empty">All done here.</div></div>`;
    });
    h += `</section>`;
  });
  return h;
}

function trophyRow(t){
  const done = !!state.done[t.id];
  let h = `<li class="tr${done?" done":""}" data-set="done" data-id="${t.id}" id="tr-${t.id}">
    <input type="checkbox" class="ck" id="t-${t.id}" ${done?"checked":""}>
    <label class="name" for="t-${t.id}"><span class="dot" data-g="${G[t.g]}" title="${G[t.g]}"></span><span class="t">${esc(t.n)}</span>${t.tags.map(x=>`<span class="tag${x==="Missable"?" miss":""}">${x}</span>`).join("")}<span class="rar" title="Share of PSNProfiles players who have this trophy">${t.r}%</span></label>
    <div class="desc">${esc(t.d)}</div>${tipHTML(t.t)}`;
  if(t.needs) h += `<ul class="needs" aria-label="Needs">${t.needs.map(id=>`<li data-need="${id}">${esc(BYID[id].n)}</li>`).join("")}</ul>`;
  if(t.all) h += `<div class="platline" id="platline"></div>`;
  const ex = [];
  if(t.art) ex.push(`<button type="button" class="artchip" data-artchip="${t.art}" title="Show these artifacts"><span class="gem" aria-hidden="true"></span>Artifacts <span><b>0</b> / ${GROUPROWS[t.art].length}</span></button>`);
  t.links.forEach(([l,u])=>ex.push(link(l,u)));
  if(ex.length) h += `<div class="extras">${ex.join("")}</div>`;
  if(t.subs.length){
    const k = "s-"+t.id;
    h += `<details class="subs" data-k="${k}" ${isOpen(k,false)?"open":""}><summary>${t.subs.length===1?"Requirement":"Challenges"} <span class="sc" data-sc="${t.id}"></span></summary><ul class="slist">${t.subs.map(s=>subRow(s,"s",false)).join("")}</ul></details>`;
  }
  return h + `</li>`;
}

  ${mode!=="artifact"?syncPanelHTML():""}
  ${TABS.map(t=>`<section id="p-${t.id}" role="tabpanel" aria-labelledby="tab-${t.id}" ${state.tab!==t.id?"hidden":""}>${t.render()}</section>`).join("")}
  <footer>Ticks save automatically. Rarity is the share of PSNProfiles players who have each trophy. <button type="button" id="reset">Clear all checks</button></footer>`;
  document.body.classList.toggle("hide-done", state.hideDone);
  refresh(); applySearch(); setStatus();
}

function refresh(){
  const A = state.lists.artifacts;
  const tN = ALL.filter(t=>state.done[t.id]).length;
  $("tbig").innerHTML = `${tN}<small>of ${ALL.length} earned</small>`;
  root.querySelectorAll("[data-pn]").forEach(e=>e.classList.toggle("on", !!state.done[e.dataset.pn]));
  const sN = SUBIDS.filter(id=>state.subs[id]).length;
  $("tsub").textContent = `${sN} of ${SUBIDS.length} listed challenges ticked`;
  root.querySelectorAll("[data-sc]").forEach(e=>{ const t=BYID[e.dataset.sc]; e.textContent = `${t.subs.filter(s=>state.subs[s.id]).length} / ${t.subs.length}`; });
  root.querySelectorAll("[data-artchip]").forEach(e=>{ const rows=GROUPROWS[e.dataset.artchip], n=rows.filter(a=>A[a[0]]).length; e.querySelector("b").textContent=n; e.classList.toggle("full", n===rows.length); });
  root.querySelectorAll("[data-find]").forEach(b=>b.hidden = !!A[b.dataset.find] || !!state.subs[b.closest("li").dataset.id]);
  root.querySelectorAll("[data-need]").forEach(e=>e.classList.toggle("met", !!state.done[e.dataset.need]));
  const pl = $("platline"); if(pl){ const o=ALL.filter(t=>!t.all), n=o.filter(t=>state.done[t.id]).length; pl.textContent = n===o.length ? "Every other trophy is ticked." : `${n} of the other ${o.length} trophies ticked.`; }
  const aN = ART.filter(a=>A[a[0]]).length;
  $("abig").innerHTML = `${aN}<small>of ${ART.length} found</small>`;
  root.querySelectorAll("[data-gm]").forEach(e=>e.classList.toggle("on", !!A[e.dataset.gm]));
  root.querySelectorAll("[data-gc]").forEach(e=>{ const rows=GROUPROWS[e.dataset.gc]; e.textContent = `${rows.filter(a=>A[a[0]]).length} / ${rows.length}`; });
  TABS.forEach(t=>{ const c=root.querySelector(`[data-count="${t.id}"]`); if(c) c.textContent=t.count(); });
  refreshEmpty();
}

function refreshEmpty(){
  const hidden = r => r.classList.contains("filtered") || (state.hideDone && r.classList.contains("done"));
  root.querySelectorAll("[data-part]").forEach(p=>{ const rows=[...p.querySelector("ul.list").children]; p.classList.toggle("alldone", rows.length>0 && rows.every(hidden)); });
  root.querySelectorAll("details.grp").forEach(d=>{ const rows=[...d.querySelectorAll(".ar")]; d.classList.toggle("alldone", rows.every(hidden) && !d.hidden); });
}

function applySearch(){
  const q = fold(query.trim());
  let n = 0;
  root.querySelectorAll("#p-artifacts .ar").forEach(li=>{ const m = !q || li.dataset.q.includes(q); li.classList.toggle("filtered", !m); if(m) n++; });
  root.querySelectorAll("details.grp").forEach(d=>{
    const any = [...d.querySelectorAll(".ar")].some(r=>!r.classList.contains("filtered"));
    d.hidden = !!q && !any;
    d.open = q ? true : isOpen(d.dataset.k, true);
  });
  $("qn").textContent = q ? `${n} ${n===1?"match":"matches"}` : "";
  const nr = $("nores"); nr.hidden = !q || n>0; if(q && !n) nr.textContent = `No artifact names or locations match “${query.trim()}”.`;
  refreshEmpty();
}

let statusText = "";
function setStatus(t){ if(t!==undefined) statusText=t; const el=$("status"); if(el) el.textContent = statusText || (mode==="artifact" ? "Progress saves to this page" : syncOn() ? "Sync on" : "Progress saves on this device"); }

/* navigation */
function setTab(id){
  if(state.tab===id) return;
  tabY[state.tab] = window.scrollY;
  state.tab = id;
  root.querySelectorAll("[data-tab]").forEach(b=>{ const on=b.dataset.tab===id; b.setAttribute("aria-selected", on); b.tabIndex = on?0:-1; });
  TABS.forEach(t=>$("p-"+t.id).hidden = t.id!==id);
  const top = $("tabsTop").getBoundingClientRect().top + window.scrollY;
  window.scrollTo(0, (id in tabY) ? tabY[id] : Math.min(window.scrollY, top));
  save(false);
}
function spotlight(el, focusEl){
  el.scrollIntoView({block:"center", behavior: reduceMotion()?"auto":"smooth"});
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
  if(focusEl) focusEl.focus({preventScroll:true});
}
function clearSearch(){ const q=$("q"); if(q && q.value){ q.value=""; query=""; applySearch(); } }
function openGroup(d){ if(!d.open){ d.open=true; state.dx[d.dataset.k]=true; save(false); } }
function gotoArtifact(slug){
  setTab("artifacts"); clearSearch();
  const li = root.querySelector(`#p-artifacts li[data-id="${slug}"]`); if(!li) return;
  openGroup(li.closest("details"));
  spotlight(li, li.querySelector("input"));
}
function gotoGroup(k){
  setTab("artifacts"); clearSearch();
  const d = $("grp-"+k); openGroup(d);
  d.scrollIntoView({block:"start", behavior: reduceMotion()?"auto":"smooth"});
  d.querySelector("summary").focus({preventScroll:true});
}
function gotoTrophy(id){
  setTab("trophies");
  let el = $("tr-"+id);
  if(state.hideDone && state.done[id]) el = el.closest("[data-part]");
  spotlight(el, el.querySelector("input"));
}

/* guides menu */
function openMenu(){ menuOpen=true; $("menuPanel").hidden=false; $("menuBtn").setAttribute("aria-expanded","true"); const f=$("menuPanel").querySelector("a,button"); if(f) f.focus(); }
function closeMenu(refocus){ if(!menuOpen) return; menuOpen=false; $("menuPanel").hidden=true; $("menuBtn").setAttribute("aria-expanded","false"); if(refocus) $("menuBtn").focus(); }

/* saving */
const HEAD = "<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Crimson Desert \u2014 Trophy Roadmap</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Grenze+Gotisch:wght@500;700&display=swap\" rel=\"stylesheet\">\n";
function buildDoc(){
  const css = $("css").textContent, app = $("app").textContent;
  const json = JSON.stringify(state).replace(/</g,"\\u003c");
  return '<!DOCTYPE html>\n<html lang="en">\n<head>\n'+HEAD+'<style id="css">'+css+'<\/style>\n</head>\n<body>\n<main id="root"></main>\n<script id="state" type="application/json">'+json+'<\/script>\n<script id="app">'+app+'<\/script>\n</body>\n</html>\n';
}
async function downloadPage(){
  const d=new Date(), filename="crimson-desert-roadmap-"+d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+".html";
  const text = buildDoc();
  let dl = null;
  try{ if(window.claude && typeof window.claude.use==="function") dl = await window.claude.use("downloads"); }catch(e){}
  if(dl){
    try{ await dl.save({filename, data:text}); setStatus("Saved "+filename); }
    catch(e){ const c=e&&e.code; setStatus(c==="declined"?"Download cancelled":c==="rate_limited"?"A download prompt is already open":"Downloads aren’t available here"); }
    return;
  }
  try{
    const url = URL.createObjectURL(new Blob([text],{type:"text/html"}));
    const a = document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    setStatus("Downloaded "+filename);
  }catch(e){ setStatus("Downloads aren’t available here"); }
}
let timer = null;
function save(publish){
  state.ts = Date.now();
  try{ localStorage.setItem(STORE, JSON.stringify(state)) }catch(e){}
  if(publish!==false) schedulePush();
  if(mode!=="artifact" || publish===false) return;
  setStatus("Saving…");
  clearTimeout(timer);
  timer = setTimeout(async ()=>{
    try{ sessionStorage.setItem(STORE+"-view", JSON.stringify({y:window.scrollY, q:query})) }catch(e){}
    try{ await artifactNs.publish(buildDoc()); setStatus("Saved"); }
    catch(e){
      const c = e && e.code;
      if(["not_granted","not_writer","not_declared","consent_required","capability_disabled","capability_removed"].includes(c)){ mode="local"; setStatus("Saved on this device only"); }
      else if(c==="conflict"){ setStatus(""); }
      else if(c==="rate_limited"){ setStatus("Saving slowed down; kept on this device for now"); }
      else setStatus("Couldn’t save to the page; kept on this device");
    }
  }, 2000);
}

/* ---------- GitHub Gist sync (same setup as the Townfall tracker) ---------- */
const SYNC_KEY = "crimson-desert-sync", GIST_FILE = "crimson-desert-progress.json";
let sync = null; try{ sync = JSON.parse(localStorage.getItem(SYNC_KEY)||"null"); }catch(e){}
let syncOpen = false, syncBusy = false, syncAgain = false, pushTimer = null, syncMsg = "", syncErr = false, lastSync = null;
function syncOn(){ return !!(sync && sync.token && sync.gistId); }
function borrowedToken(){   /* a token another tracker on this site already saved, e.g. Townfall */
  try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k===SYNC_KEY || !/-sync$/.test(k)) continue;
    const v=JSON.parse(localStorage.getItem(k)||"null"); if(v && v.token) return {token:v.token, from:k.replace(/-sync$/,"").split("-").map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(" ")}; } }catch(e){}
  return null;
}
function syncPanelHTML(){
  let body;
  if(syncOn()) body = `<p>Your ticks sync to a secret GitHub gist named ${GIST_FILE}. Any device connected with your token shares the same progress, and ticks from different devices are merged one by one.</p>
    <div class="row"><button type="button" class="btn primary" id="syncNow">Sync now</button><button type="button" class="btn" id="syncOff">Disconnect this device</button></div>`;
  else { const b = borrowedToken();
    body = `<p>Paste a GitHub personal access token with the <strong>gist</strong> scope. The token stays in this browser only. The first device creates a secret gist named ${GIST_FILE}; other devices find it automatically.</p>
    ${b?`<div class="row"><button type="button" class="btn primary" id="syncBorrow">Use the token saved by ${esc(b.from)}</button></div>`:""}
    <div class="row"><input type="password" id="tokenIn" placeholder="ghp_…" autocomplete="off" spellcheck="false" aria-label="GitHub token"><button type="button" class="btn${b?"":" primary"}" id="syncConnect">Connect</button></div>`; }
  return `<section class="syncp" id="syncPanel" ${syncOpen?"":"hidden"} aria-labelledby="sync-h"><h2 id="sync-h">Sync between devices</h2>${body}<div class="smsg${syncErr?" err":""}" id="smsg" role="status">${esc(syncMsg)}</div></section>`;
}
function refreshSyncPanel(){ const p=$("syncPanel"); if(p) p.outerHTML = syncPanelHTML(); }
function sMsg(t, err){ syncMsg=t||""; syncErr=!!err; const el=$("smsg"); if(el){ el.textContent=syncMsg; el.classList.toggle("err",syncErr); } }
function sStatus(t){ statusText=t; setStatus(); }
async function gh(path, opts){
  opts = opts||{};
  const r = await fetch("https://api.github.com"+path, {method:opts.method||"GET", cache:"no-store",
    headers:Object.assign({"Authorization":"Bearer "+(opts.token||sync.token),"Accept":"application/vnd.github+json"}, opts.body?{"Content-Type":"application/json"}:{}),
    body: opts.body?JSON.stringify(opts.body):undefined});
  if(!r.ok){ const e=new Error("GitHub "+r.status); e.status=r.status; throw e; }
  return r.json();
}
function payload(){ return JSON.stringify({app:"crimson-desert-roadmap", done:state.done, subs:state.subs, lists:state.lists, hideDone:!!state.hideDone, mt:state.mt, ts:state.ts}, null, 1); }
function errText(e){
  if(e && (e.status===401||e.status===403)) return "GitHub rejected the token. Check that it has the gist scope and hasn’t expired.";
  if(e && e.status===404) return "The sync gist wasn’t found. Disconnect and connect again to recreate it.";
  return "Couldn’t reach GitHub. Your ticks are kept on this device and will sync when you’re back online.";
}
function stampNow(){ return new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}); }
function valOf(src,set,id){ if(set==="pref") return !!src[id]; const bag = set==="done"?src.done : set==="subs"?src.subs : (src.lists||{})[set]; return !!(bag && bag[id]); }
function setVal(set,id,v){
  if(set==="pref"){ state[id]=v; const h=$("hide"); if(h) h.checked=v; document.body.classList.toggle("hide-done", state.hideDone); return; }
  if(set!=="done" && set!=="subs") state.lists[set] = state.lists[set]||{};
  const bag = bagFor(set); if(v) bag[id]=true; else delete bag[id];
  root.querySelectorAll(`li[data-set="${set}"][data-id="${id}"]`).forEach(x=>{ x.classList.toggle("done", v); const c=x.querySelector(":scope > input"); if(c) c.checked=v; });
}
function merge(r){   /* newest change wins for each tick, so devices never wipe each other's work */
  const rmt = r.mt || {};
  if(!r.mt){ ["done","subs"].forEach(set=>Object.keys(r[set]||{}).forEach(id=>rmt[set+"|"+id]=1)); Object.keys(r.lists||{}).forEach(l=>Object.keys(r.lists[l]||{}).forEach(id=>rmt[l+"|"+id]=1)); }
  let changed = 0, needPush = false;
  new Set([...Object.keys(rmt), ...Object.keys(state.mt)]).forEach(k=>{
    const lt = state.mt[k]||0, rt = rmt[k]||0, i = k.indexOf("|"), set = k.slice(0,i), id = k.slice(i+1);
    if(rt > lt){ setVal(set, id, valOf(r,set,id)); state.mt[k] = rt; changed++; }
    else if(lt > rt) needPush = true;
  });
  return {changed, needPush};
}
async function runSync(){
  if(!syncOn()) return;
  if(syncBusy){ syncAgain = true; return; }
  syncBusy = true; sStatus("Syncing…");
  try{
    const g = await gh("/gists/"+sync.gistId);
    const f = g.files && g.files[GIST_FILE];
    let remote = {};
    if(f){ let txt = f.content; if(f.truncated){ txt = await (await fetch(f.raw_url,{cache:"no-store"})).text(); } try{ remote = JSON.parse(txt||"{}"); }catch(e){ remote = {}; } }
    const {changed, needPush} = merge(remote);
    if(changed){ refresh(); state.ts = Date.now(); try{ localStorage.setItem(STORE, JSON.stringify(state)) }catch(e){} }
    if(needPush || !f) await gh("/gists/"+sync.gistId, {method:"PATCH", body:{files:{[GIST_FILE]:{content:payload()}}}});
    lastSync = stampNow(); sStatus("Synced "+lastSync); sMsg("");
  }catch(e){ sStatus("Not synced"); sMsg(errText(e), true); }
  finally{ syncBusy = false; if(syncAgain){ syncAgain = false; runSync(); } }
}
async function connect(token){
  token = (token||"").trim();
  if(!token){ sMsg("Paste your token first.", true); return; }
  sMsg("Connecting…");
  try{
    let id = null;
    for(let page=1; page<=5 && !id; page++){
      const list = await gh("/gists?per_page=100&page="+page, {token});
      const hit = list.find(g=>g.files && g.files[GIST_FILE]); if(hit) id = hit.id;
      if(list.length<100) break;
    }
    if(!id){
      const g = await gh("/gists", {token, method:"POST", body:{description:"Crimson Desert trophy tracker progress", public:false, files:{[GIST_FILE]:{content:payload()}}}});
      id = g.id;
    }
    sync = {token, gistId:id};
    try{ localStorage.setItem(SYNC_KEY, JSON.stringify(sync)); }catch(e){}
    refreshSyncPanel();
    await runSync();
    if(!syncErr) sMsg("Connected. Progress now syncs automatically.");
  }catch(e){ sync=null; sMsg(errText(e), true); }
}
function schedulePush(){ if(!syncOn()) return; sStatus("Syncing…"); clearTimeout(pushTimer); pushTimer = setTimeout(()=>{ pushTimer=null; runSync(); }, 1500); }
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && !pushTimer) runSync(); });
window.addEventListener("online", ()=>{ runSync(); });

/* events */
root.addEventListener("change", e=>{
  const t = e.target;
  if(t.id==="hide"){ state.hideDone=t.checked; state.mt["pref|hideDone"]=Date.now(); document.body.classList.toggle("hide-done", t.checked); refreshEmpty(); save(); return; }
  if(t.type!=="checkbox") return;
  const li = t.closest("li[data-set]"); if(!li) return;
  const set = li.dataset.set, id = li.dataset.id, bag = bagFor(set);
  if(t.checked) bag[id]=true; else delete bag[id];
  state.mt[set+"|"+id] = Date.now();
  root.querySelectorAll(`li[data-set="${set}"][data-id="${id}"]`).forEach(x=>{ x.classList.toggle("done", t.checked); const c=x.querySelector(":scope > input"); if(c) c.checked=t.checked; });
  refresh(); save();
});
root.addEventListener("input", e=>{ if(e.target.id==="q"){ query=e.target.value; applySearch(); } });
root.addEventListener("click", e=>{
  const tab = e.target.closest("[data-tab]"); if(tab){ setTab(tab.dataset.tab); return; }
  if(e.target.closest("#menuBtn")){ menuOpen ? closeMenu(false) : openMenu(); return; }
  if(e.target.closest("#dlPage")){ closeMenu(true); downloadPage(); return; }
  if(e.target.closest("#menuPanel a")){ closeMenu(false); return; }
  if(e.target.id==="syncToggle"){ syncOpen=!syncOpen; e.target.setAttribute("aria-expanded",syncOpen); if(syncOpen) refreshSyncPanel(); else $("syncPanel").hidden=true; if(syncOpen && !syncOn()){ const b=$("syncBorrow")||$("tokenIn"); if(b) b.focus(); } return; }
  if(e.target.id==="syncConnect"||e.target.id==="syncBorrow"){
    const b=e.target, tok = b.id==="syncBorrow" ? (borrowedToken()||{}).token : $("tokenIn").value;
    b.disabled=true; connect(tok).finally(()=>{ const nb=$(b.id); if(nb) nb.disabled=false; }); return; }
  if(e.target.id==="syncNow"){ runSync(); return; }
  if(e.target.id==="syncOff"){ sync=null; try{ localStorage.removeItem(SYNC_KEY) }catch(err){} statusText=""; setStatus(); refreshSyncPanel(); sMsg("This device is disconnected. Your gist and its progress are untouched."); return; }
  const f = e.target.closest("[data-find]"); if(f){ gotoArtifact(f.dataset.find); return; }
  const ch = e.target.closest("[data-artchip]"); if(ch){ gotoGroup(ch.dataset.artchip); return; }
  const gt = e.target.closest("[data-goto-trophy]"); if(gt){ gotoTrophy(gt.dataset.gotoTrophy); return; }
  const sm = e.target.closest("summary");
  if(sm){ const d=sm.parentElement; if(d.dataset.k && !(d.classList.contains("grp") && query.trim())){ state.dx[d.dataset.k] = !d.open; save(false); } return; }
  if(e.target.id==="reset" && confirm("Clear every trophy, challenge and artifact check?")){
    const now=Date.now(), mark=(set,bag)=>Object.keys(bag).forEach(id=>state.mt[set+"|"+id]=now);
    mark("done",state.done); mark("subs",state.subs); Object.keys(state.lists).forEach(l=>mark(l,state.lists[l]));
    state.done={}; state.subs={}; Object.keys(state.lists).forEach(k=>state.lists[k]={}); render(); save();
  }
});
root.addEventListener("keydown", e=>{
  if(e.target.id==="tokenIn" && e.key==="Enter"){ $("syncConnect").click(); return; }
  if(!e.target.matches("[data-tab]") || !["ArrowLeft","ArrowRight","Home","End"].includes(e.key)) return;
  e.preventDefault();
  const i = TABS.findIndex(t=>t.id===e.target.dataset.tab), n = TABS.length;
  const j = e.key==="Home" ? 0 : e.key==="End" ? n-1 : (i + (e.key==="ArrowRight"?1:-1) + n) % n;
  const b = root.querySelector(`[data-tab="${TABS[j].id}"]`); b.focus(); setTab(TABS[j].id);
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && menuOpen) closeMenu(true); });
document.addEventListener("click", e=>{ if(menuOpen && !e.target.closest("#menu")) closeMenu(false); });
root.addEventListener("focusout", e=>{ if(menuOpen && e.target.closest("#menu") && e.relatedTarget && !e.relatedTarget.closest("#menu")) closeMenu(false); });

render();
if(syncOn()) runSync();
try{
  const v = JSON.parse(sessionStorage.getItem(STORE+"-view")||"null");
  if(v){
    sessionStorage.removeItem(STORE+"-view");
    if(v.q){ query=v.q; $("q").value=v.q; applySearch(); }
    const y = +v.y||0, go = ()=>window.scrollTo(0,y);
    requestAnimationFrame(go);
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ if(window.scrollY < y-4) go(); });
  }
}catch(e){}
(async ()=>{
  try{
    if(window.claude && typeof window.claude.use==="function"){
      artifactNs = await window.claude.use("artifact");
      if(artifactNs){ mode="artifact"; ["syncToggle","syncPanel"].forEach(id=>{ const el=$(id); if(el) el.remove(); }); setStatus(); }
    }
  }catch(e){}
})();

})();
</script>
</body>
</html>
