<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Platinum trackers</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Color settings: light mode. Dark mode is set further down. */
  --background:#E4E5E0;     /* page background */
  --surface:#F0F0EC;        /* game cards */
  --text:#1E2627;           /* main text and headings */
  --text-soft:#5D6966;      /* subtitle, counts, footnote */
  --border:#C3C7C0;         /* borders, dividers, unfilled progress bars */
  --accent:#8E3A2A;         /* filled progress bars, percentage badge text */
  --accent-soft:#E9D6CF;    /* percentage badge background */
  --accent-2:#476663;       /* focus outlines */
  --accent-2-soft:#D3DEDB;  /* not used on this page */
  --platinum:#5C7A93;       /* background of cards with the platinum earned */
  --on-platinum:#FFFFFF;    /* text and bars on a platinum card */
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
/* Dark mode colors (used when the device is in dark mode). */
@media (prefers-color-scheme: dark){
  :root{
    --background:#171C1D; --surface:#1F2627; --text:#E2E4DF; --text-soft:#9AA5A1; --border:#36403F;
    --accent:#D1735E; --accent-soft:#3A2420; --accent-2:#86AAA5; --accent-2-soft:#22302F; --platinum:#8DAAC2; --on-platinum:#171C1D;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--background);color:var(--text);font:400 16px/1.55 "Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:44px 20px 80px}
h1,h2{font-family:"Spectral",Georgia,"Times New Roman",serif;font-weight:600;line-height:1.2;margin:0}
h1{font-size:clamp(32px,7vw,48px);letter-spacing:-.01em}
.sub{color:var(--text-soft);margin:8px 0 30px}
.games{display:grid;gap:14px}
a.card{display:block;color:inherit;text-decoration:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:18px 18px 16px;transition:border-color .15s}
a.card:hover{border-color:var(--text)}
a.card:focus-visible{outline:2px solid var(--accent-2);outline-offset:3px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.card h2{font-size:22px}
/* Each card uses its game's own accent (set in the GAMES list below), or --accent if none is set. */
.card{--card-accent:var(--game-accent,var(--accent))}
.card{--card-bg:var(--game-bg,var(--surface));--card-fg:var(--game-fg,var(--text));--card-fg-soft:var(--game-fg-soft,var(--text-soft));--card-tick:var(--game-tick,var(--border))}
@media (prefers-color-scheme: dark){ .card{--card-accent:var(--game-accent-dark,var(--game-accent,var(--accent)));
  --card-bg:var(--game-bg-dark,var(--surface));--card-fg:var(--game-fg-dark,var(--text));--card-fg-soft:var(--game-fg-soft-dark,var(--text-soft));--card-tick:var(--game-tick-dark,var(--border))} }
.card{--card-plat:var(--platinum);--card-on-plat:var(--on-platinum)}
a.card{border-left:4px solid var(--card-accent);background:var(--card-bg);color:var(--card-fg)}
.badge{font-size:12px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--accent-soft);background:color-mix(in srgb,var(--card-accent) 16%,var(--card-bg));color:var(--card-accent);white-space:nowrap}
/* Cards for games with the platinum earned */
a.card.done{background:var(--card-plat);border-color:var(--card-plat);color:var(--card-on-plat)}
a.card.done:hover{border-color:var(--text)}
.card.done .stats,.card.done .stats b{color:var(--card-on-plat)}
.card.done .tick{background:color-mix(in srgb,var(--card-on-plat) 30%,transparent)}
.badge.plat{background:var(--card-on-plat);color:var(--card-plat)}
.ticks{display:flex;gap:2px;align-items:flex-end;height:30px;margin-top:14px}
.tick{flex:1;background:var(--card-tick);border-radius:1px;height:40%}
.tick.on{background:var(--card-accent);height:100%}
.card.done .tick.on{background:var(--card-on-plat)}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:14px;color:var(--card-fg-soft)}
.stats b{font-family:"Spectral",Georgia,serif;font-size:19px;font-weight:600;color:var(--card-fg)}
.note{margin-top:28px;font-size:13px;color:var(--text-soft)}
@media (max-width:520px){main{padding:30px 16px 64px}}
</style>
</head>
<body>
<main>
  <h1>Platinum trackers</h1>
  <p class="sub">Pick a game to open its roadmap and checklist.</p>
  <div class="games" id="games"></div>
  <p class="note" id="note"></p>
</main>
<script>
(function(){
/* Add one entry per game. folder = the folder name in this repository.
   accent = the card's color in light mode; accentDark = its color in dark mode (optional, use a lighter shade).
   Leave both out to use the default --accent color.
   cardColor = the card's background before the platinum; cardColorDark = the same in dark mode (optional).
   Leave them out to use the default --surface color. Text on top switches to white or dark automatically for contrast.
   Once the platinum is earned, every card switches to the --platinum color set at the top of this file. */
const GAMES = [
  {folder:"townfall", title:"Silent Hill: Townfall", accent:"#8E3A2A", accentDark:"#D1735E",
   cardColor:"#1f2627", cardColorDark:"#1F2627", trophies:37, collectibles:227, platinumId:"plat",
   localKey:"townfall-roadmap", syncKey:"townfall-sync", gistFile:"townfall-progress.json"}
];

/* Picks white or near-black text, whichever reads better on a hex color. */
function onColor(hex){
  const m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(hex||"").trim()); if(!m) return null;
  let x = m[1]; if(x.length===3) x = x.split("").map(c=>c+c).join("");
  const lum = [0,2,4].map(i=>{ const v=parseInt(x.substr(i,2),16)/255; return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4); });
  const L = 0.2126*lum[0]+0.7152*lum[1]+0.0722*lum[2];
  return (1.05)/(L+0.05) >= (L+0.05)/(0.0096+0.05) ? "#FFFFFF" : "#171C1D";
}
/* Background plus matching text, soft-text and empty-bar colors for one card. */
function cardVars(bg, sfx){
  if(!(bg && window.CSS && CSS.supports("color", bg))) return "";
  const fg = onColor(bg);
  if(!fg) return `--game-bg${sfx}:${bg};`;
  return `--game-bg${sfx}:${bg};--game-fg${sfx}:${fg};--game-fg-soft${sfx}:color-mix(in srgb,${fg} 68%,${bg});--game-tick${sfx}:color-mix(in srgb,${fg} 22%,${bg});`;
}
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const progress = {};   // folder -> {done, items, ts, from}

function readLocal(){
  GAMES.forEach(g=>{
    try{
      const s = JSON.parse(localStorage.getItem(g.localKey)||"null");
      if(s) progress[g.folder] = {done:s.done||{}, items:s.items||{}, ts:s.ts||0, from:"device"};
    }catch(e){}
  });
}

function when(ts){
  if(!ts) return "";
  const d = new Date(ts), now = new Date();
  const same = d.toDateString()===now.toDateString();
  return same ? "today, "+d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}) : d.toLocaleDateString([], {day:"numeric",month:"short",year: d.getFullYear()===now.getFullYear()?undefined:"numeric"});
}

function render(){
  document.getElementById("games").innerHTML = GAMES.map(g=>{
    const p = progress[g.folder];
    const t = p ? Object.keys(p.done).length : 0;
    const c = p ? Object.keys(p.items).length : 0;
    const plat = p && p.done[g.platinumId];
    const pct = Math.round(t/g.trophies*100);
    const badge = plat ? `<span class="badge plat">Platinum earned</span>` : p ? `<span class="badge">${pct}%</span>` : `<span class="badge">Not started</span>`;
    const ok = c => c && window.CSS && CSS.supports("color", c);
    const style = (ok(g.accent)?`--game-accent:${g.accent};`:"") + (ok(g.accentDark)?`--game-accent-dark:${g.accentDark};`:"")
      + cardVars(g.cardColor, "") + cardVars(g.cardColorDark, "-dark");
    return `<a class="card${plat?" done":""}" href="${esc(g.folder)}/"${style?` style="${esc(style)}"`:""}>
      <div class="top"><h2>${esc(g.title)}</h2>${badge}</div>
      <div class="ticks" aria-hidden="true">${Array.from({length:g.trophies},(_,i)=>`<span class="tick${i<t?" on":""}"></span>`).join("")}</div>
      <div class="stats"><span><b>${t}</b> / ${g.trophies} trophies</span><span><b>${c}</b> / ${g.collectibles} collectibles</span>${p&&p.ts?`<span>Updated ${esc(when(p.ts))}</span>`:""}</div>
    </a>`;
  }).join("");
}

async function readGists(){
  const tokenOf = g => { try{ const s = JSON.parse(localStorage.getItem(g.syncKey)||"null"); return s&&s.token; }catch(e){ return null; } };
  const token = GAMES.map(tokenOf).find(Boolean);
  const note = document.getElementById("note");
  if(!token){ note.textContent = "Showing progress saved on this device. Connect Sync inside a tracker to see your latest progress from every device here."; return; }
  try{
    const head = {"Authorization":"Bearer "+token, "Accept":"application/vnd.github+json"};
    const list = await (await fetch("https://api.github.com/gists?per_page=100", {headers:head, cache:"no-store"})).json();
    for(const g of GAMES){
      const hit = Array.isArray(list) && list.find(x=>x.files && x.files[g.gistFile]);
      if(!hit) continue;
      const full = await (await fetch("https://api.github.com/gists/"+hit.id, {headers:head, cache:"no-store"})).json();
      const f = full.files[g.gistFile];
      const s = JSON.parse(f.truncated ? await (await fetch(f.raw_url,{cache:"no-store"})).text() : f.content);
      const cur = progress[g.folder];
      if(!cur || (s.ts||0) >= (cur.ts||0)) progress[g.folder] = {done:s.done||{}, items:s.items||{}, ts:s.ts||0, from:"gist"};
    }
    render();
    note.textContent = "Progress synced from GitHub.";
  }catch(e){
    note.textContent = "Couldn't reach GitHub, so this shows progress saved on this device.";
  }
}

readLocal(); render(); readGists();
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible"){ readLocal(); render(); readGists(); } });
})();
</script>
</body>
</html>
